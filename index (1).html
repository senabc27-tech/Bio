<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nunung Rianty | Bio Links</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-pink: #ff9a9e;
            --accent-purple: #fecfef;
            --text-dark: #4a4a4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            /* Latar belakang dikembalikan ke dominan Pink yang estetik */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            width: 100%;
            max-width: 360px;
            text-align: center;
            /* Efek kaca tetap clean */
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .profile-pic {
            width: 85px; height: 85px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            border: 3px solid white;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem; color: #fff;
            background: linear-gradient(to right, var(--accent-pink), #fca6bd);
            box-shadow: 0 8px 16px rgba(255, 154, 158, 0.3);
        }

        .name {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 2rem;
        }

        .links-container { display: flex; flex-direction: column; gap: 0.9rem; }

        .link-btn {
            display: flex; align-items: center; justify-content: start; gap: 16px;
            text-decoration: none;
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.9);
            padding: 0.9rem 1.4rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .link-btn:hover {
            transform: translateY(-2px);
            background: #ffffff;
            color: var(--accent-pink);
            border-color: var(--accent-pink);
            box-shadow: 0 6px 15px rgba(255, 154, 158, 0.2);
        }

        .icon { width: 26px; height: 26px; object-fit: contain; }
    </style>
</head>
<body>

    <main class="card">
        <div class="profile-pic">N</div>
        <h1 class="name">Nunung Rianty</h1>

        <div class="links-container">
            <a href="tiktok.com/@nunungrianty16" class="link-btn" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" class="icon"> TikTok
            </a>
            <a href="https://www.instagram.com/nunungrianty16" class="link-btn" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" class="icon"> Instagram
            </a>
            <a href="https://id.shp.ee/melese2b?smtt=0.0.9" class="link-btn" target="_blank">
                <img src="https://img.icons8.com/color/48/shopee.png" class="icon"> Shopee
            </a>
            <a href="https://www.facebook.com/share/1NAq1XVqv4/" class="link-btn" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" class="icon"> Facebook
            </a>
        </div>
    </main>

</body>
</html>
