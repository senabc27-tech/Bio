    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1; /* Sedikit diterangkan agar terbaca di background */
            --glass-bg: rgba(15, 23, 42, 0.4); /* Tombol tetap sedikit gelap */
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            /* MASUKKAN LINK GAMBAR KAMU DI BAWAH INI */
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
                        url('https://raw.githubusercontent.com/senabc27-tech/Bio/main/14334c7b194b995dad25648a14dfbf53.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        /* Container transparan, hanya menyisakan isinya */
        .glass-card {
            padding: 2.5rem 0;
            width: 100%;
            max-width: 420px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s forwards ease-out;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile Section */
        .profile-pic {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-color), #1e293b);
            margin: 0 auto 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transition: transform 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        .name {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* Tambahan shadow agar teks nama terbaca */
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); /* Tambahan shadow agar bio terbaca */
        }

        /* Link Buttons */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 0.9rem;
            border-radius: 14px;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(15px);
        }

        .link-btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        .link-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            color: var(--accent-color);
        }

        .link-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .link-btn:hover svg {
            transform: scale(1.15);
        }
        
    </style>
</head>
